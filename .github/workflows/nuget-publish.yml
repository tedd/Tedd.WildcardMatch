name: Build, test and publish NuGet

on:
  push:
    branches: [main, deploy]
  pull_request:
    branches: [main, deploy]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nuget-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test:
    runs-on: ubuntu-latest
    outputs:
      release-changed: ${{ steps.release.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect release version change
        id: release
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          PREVIOUS_REVISION: ${{ github.event.before }}
        run: |
          $changed = $false
          if ($env:GITHUB_REF -ceq 'refs/heads/deploy') {
            if ($env:EVENT_NAME -eq 'workflow_dispatch' -or $env:PREVIOUS_REVISION -match '^0+$') {
              $changed = $true
            } elseif ($env:EVENT_NAME -eq 'push') {
              $path = 'src/Tedd.WildcardMatch/Tedd.WildcardMatch.csproj'
              $current = [xml](Get-Content -LiteralPath $path -Raw)
              $previousText = git show "${env:PREVIOUS_REVISION}:$path"
              if ($LASTEXITCODE -ne 0) { throw 'Cannot verify the previous release version.' }
              $previous = [xml](($previousText -join "`n").TrimStart([char]0xFEFF))
              $changed = [string]$current.Project.PropertyGroup.Version -cne [string]$previous.Project.PropertyGroup.Version
            }
          }
          "changed=$($changed.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
          global-json-file: global.json
      - name: Restore
        run: dotnet restore src/Tedd.WildcardMatch.sln
      - name: Build
        run: dotnet build src/Tedd.WildcardMatch.sln --no-restore --configuration Release
      - name: Test .NET 8 compatibility
        run: dotnet test src/Tedd.WildcardMatch.Tests --no-build --no-restore --configuration Release --framework net8.0
      - name: Test .NET 10
        run: dotnet test src/Tedd.WildcardMatch.Tests --no-build --no-restore --configuration Release --framework net10.0
      - name: Test .NET 11
        run: dotnet test src/Tedd.WildcardMatch.Tests --no-build --no-restore --configuration Release --framework net11.0
      - name: Validate benchmark competitors
        run: dotnet run --project src/Tedd.WildcardMatch.Benchmark --no-build --configuration Release -- --validate-packages
      - name: Pack
        run: dotnet pack src/Tedd.WildcardMatch/Tedd.WildcardMatch.csproj --no-build --no-restore --configuration Release --output artifacts/packages
      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/packages/*
          if-no-files-found: error

  publish:
    needs: build-test
    if: github.ref == 'refs/heads/deploy' && needs.build-test.outputs.release-changed == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: nuget
    steps:
      - uses: actions/checkout@v4
      - name: Verify release branch and version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -cne 'refs/heads/deploy') { throw 'NuGet publication requires the deploy branch.' }
          $project = [xml](Get-Content -LiteralPath 'src/Tedd.WildcardMatch/Tedd.WildcardMatch.csproj')
          $version = [string]$project.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Project Version must be MAJOR.MINOR.PATCH.' }
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/packages
      - name: Publish package and symbols
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) { throw 'NUGET_API_KEY is required.' }
          $packages = @(Get-ChildItem -LiteralPath artifacts/packages -Filter '*.nupkg')
          if ($packages.Count -ne 1) { throw 'Expected exactly one NuGet package.' }
          # dotnet also publishes the adjacent .snupkg symbol package.
          dotnet nuget push $packages[0].FullName --source https://api.nuget.org/v3/index.json --api-key $env:NUGET_API_KEY --skip-duplicate
          if ($LASTEXITCODE -ne 0) { throw 'NuGet publication failed.' }
